name: Wheels

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # One-time PyPI setup: Trusted Publisher for janba/GEL, workflow
  # wheels.yml, environment name "pypi". Tags matching v* upload.
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/PyGEL3D
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist

      - name: Verify release version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"

          if [ "$version" != "$expected" ]; then
            echo "::error title=Version mismatch::Tag ${GITHUB_REF_NAME} does not match VERSION ${version}"
            exit 1
          fi

          for file in dist/*; do
            base="$(basename "$file")"
            case "$base" in
              *.whl|*.tar.gz)
                if [[ "$base" != pygel3d-${expected}* ]]; then
                  echo "::error title=Artifact version mismatch::Unexpected artifact ${base} for tag ${GITHUB_REF_NAME}"
                  exit 1
                fi
                ;;
            esac
          done

      - name: Check artifacts
        run: ls -la dist

      - uses: pypa/gh-action-pypi-publish@release/v1
