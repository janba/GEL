name: Test PyPI installation

on:
  workflow_dispatch:

jobs:
  install-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa

      - name: Resolve latest PyPI version
        id: latest
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json, urllib.request
          url = "https://pypi.org/pypi/PyGEL3D/json"
          with urllib.request.urlopen(url) as response:
              data = json.load(response)
          print(data["info"]["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest PyPI version: $VERSION"

      - name: Install that exact version from PyPI
        run: pip install "PyGEL3D==${{ steps.latest.outputs.version }}"

      - name: Smoke test
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pygel3d

          expected = os.environ["EXPECTED_VERSION"]
          got = getattr(pygel3d, "__version__", None)
          print("expected:", expected)
          print("installed:", got)
          if got != expected:
              raise SystemExit(
                  f"installed {got!r}, expected latest PyPI version {expected!r}"
              )

          from pygel3d import hmesh
          m = hmesh.Manifold()
          print("Successfully created Manifold")
          PY
